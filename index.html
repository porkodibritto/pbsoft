<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Image Resizer Layout</title>
    <style>
  
        
        /* Card Container 2: Flexible height/width with light green background */
        .card-2 {
            flex: 1;
            min-width: 340px;
            max-width: 500px;
            width: auto;
            height: auto;
            background-color: #90EE90; /* Light Green */
	    border: 1px solid #ffb6c1;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            user-select: none;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #e9e9e9; /* Light gray to look read-only */
        }
        input[type="number"] {
            width: 110px;
            padding: 6px;
            border: 1px solid #aac4a9;
            border-radius: 4px;
        }

        input[type="number"]:disabled {
            background-color: #f1f5f1;
            cursor: not-allowed;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:disabled {
            background-color: #cccccc !important;
            color: #666666;
            cursor: not-allowed;
        }

        #resizeBtn {
            background-color: #2e7d32;
            color: white;
        }

        /* Distinctive Green Download Button */
        #downloadBtn {
            background-color: #4caf50;
            color: white;
            display: none;
            margin-top: 15px;
            width: 100%;
        }
        
        #downloadBtn:hover {
            background-color: #43a047;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    

    <!-- Card Container 2 (Image Resizer) -->
    <div class="card-2">
        <h3>Quality Image Resizer by File Size</h3>
	<p>  </p>
        <h4>   please enter value little more than the file size you need </h4>
        
        <!-- Only image formats accepted -->
        <div class="form-group">
            <input type="file" id="imageInput" accept="image/*">
        </div>
    <div class="form-group">
        <label for="textbox1">The File Size :</label>
        <!-- Textbox 1 to display File Size -->
        <input type="text" id="textbox1" placeholder="Size will appear here..." readonly>
    </div>
        <!-- Controls for Target Size -->
        <div class="form-group">
            <label><input type="checkbox" id="chkKB" disabled> IN KB</label>
            <input type="number" id="txtKB" placeholder="50 - 1024" disabled>
        </div>

        <div class="form-group">
            <label><input type="checkbox" id="chkMB" disabled> IN MB</label>
            <input type="number" id="txtMB" placeholder="1 - 100" disabled>
        </div>

        <!-- Action Processing Buttons -->
        <button id="resizeBtn" disabled>Resize Image</button>
        <div>
            <button id="downloadBtn">Download Resized Image</button>
        </div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const textbox = document.getElementById('textbox1');
    const chkKB = document.getElementById('chkKB');
    const txtKB = document.getElementById('txtKB');
    const chkMB = document.getElementById('chkMB');
    const txtMB = document.getElementById('txtMB');
    const resizeBtn = document.getElementById('resizeBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let originalFile = null;
    let resizedBlob = null;

    // Reset workspace completely back to disabled/empty state
    function clearAndDisableAll() {
        imageInput.value = '';
        originalFile = null;
        resizedBlob = null;
        textbox.value = "";
        chkKB.checked = false;
        chkKB.disabled = true;
        txtKB.value = '';
        txtKB.disabled = true;

        chkMB.checked = false;
        chkMB.disabled = true;
        txtMB.value = '';
        txtMB.disabled = true;

        resizeBtn.disabled = true;
        downloadBtn.style.display = 'none';
    }

    // Reset immediately whenever file input button is clicked
    imageInput.addEventListener('click', function() {
        clearAndDisableAll();
    });
    imageInput.addEventListener('change', function(event) {
        const imageInput = event.target;
        const textbox = document.getElementById('textbox1');

        // Verify if a file is actually selected
        if (imageInput.files.length > 0) {
            const file = imageInput.files[0];
            const sizeInBytes = file.size; // Browser reads native size in bytes

            // Perform mathematical conversion (divide by 1024)
            const sizeInKB = (sizeInBytes / 1024).toFixed(2);
            const sizeInMB = (sizeInBytes / (1024 * 1024)).toFixed(2);

            // Output the formatted string inside Textbox 1
            textbox.value = `${sizeInKB} KB / ${sizeInMB} MB`;
        } else {
            // Clear textbox if no file is selected
            textbox.value = '';
        }
    });
    // Fire state triggers when an image selection finishes
    imageInput.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            originalFile = e.target.files[0];
            
            chkKB.disabled = false;
            chkMB.disabled = false;
            //resizeBtn.disabled = false;
        }
    });

    // Checkbox toggling behaviors
    chkKB.addEventListener('change', function() {
        if (this.checked) {
            txtKB.disabled = false;
            chkMB.checked = false;
            txtMB.disabled = true;
            txtMB.value = '';

        } else {
            txtKB.disabled = true;
            txtKB.value = '';

        }
	toggleButton1();

    });

    chkMB.addEventListener('change', function() {
        if (this.checked) {
            txtMB.disabled = false;
            chkKB.checked = false;
            txtKB.disabled = true;
            txtKB.value = '';
	    
        } else {
            txtMB.disabled = true;
            txtMB.value = '';
	    
        }
	toggleButton1();
    });
        // Function to check input values and toggle the button
        function toggleButton1() {
            // .trim() removes empty whitespace spaces
            const hasValue1 = txtKB.value.trim() !== "";
            const hasValue2 = txtMB.value.trim() !== "";

            // Enable button if textbox 1 OR textbox 2 has an input value
            resizeBtn.disabled = !(hasValue1 || hasValue2);
        }

        // Attach event listeners to track real-time user typing
        txtKB.addEventListener('input', toggleButton1);
        txtMB.addEventListener('input', toggleButton1);

    // Process High-Quality Image Resizing 
    resizeBtn.addEventListener('click', function() {
        if (!originalFile) return;

        // 1. Immediately lock down input fields
        chkKB.disabled = true;
        txtKB.disabled = true;
        chkMB.disabled = true;
        txtMB.disabled = true;
        resizeBtn.disabled = true;

        let targetSizeInBytes = 0;

        // 2. Validate thresholds and balance conditions
        if (chkKB.checked) {
            let val = parseInt(txtKB.value) || 0;
            if (val < 50) val = 50;
            if (val > 1024) val = 1024;
            txtKB.value = val;
            targetSizeInBytes = val * 1024;
        } else if (chkMB.checked) {
            let val = parseInt(txtMB.value) || 0;
            if (val < 1) val = 50; // Set to 50 if below 1 or negative per rule
            if (val > 100) val = 100;
            txtMB.value = val;
            targetSizeInBytes = val * 1024 * 1024;
        } else {
            alert('Please select a target checkbox.');
            chkKB.disabled = false;
            chkMB.disabled = false;
            resizeBtn.disabled = false;
            return;
        }

        // 3. Process image conversion logic
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Predictive High-Quality Dimension Scaling
                // If original format can't reach high file sizes naturally, dimension padding is applied safely
                let scaleFactor = 1.0;
                
                // Approximate expected output weight vs current weight to find initial scaling bounds
                if (originalFile.size < targetSizeInBytes) {
                    scaleFactor = Math.sqrt(targetSizeInBytes / originalFile.size) * 1.1; 
                } else {
                    scaleFactor = Math.sqrt(targetSizeInBytes / originalFile.size) * 0.95;
                }

                // Protect boundaries against extreme resizing calculations
                scaleFactor = Math.max(0.1, Math.min(scaleFactor, 4.0));

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = img.width * scaleFactor;
                canvas.height = img.height * scaleFactor;
                
                // Configure smooth scale smoothing options
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Smart loop to converge quality variables onto the target size
                let quality = 0.85;
                let steps = 5;

                function adjustQualityLoop() {
                    canvas.toBlob(function(blob) {
                        resizedBlob = blob;
                        steps--;

                        if (steps > 0) {
                            // Scale optimization direction logic
                            if (blob.size > targetSizeInBytes) {
                                quality = Math.max(0.1, quality - 0.12);
                            } else if (blob.size < targetSizeInBytes * 0.85) {
                                quality = Math.min(1.0, quality + 0.08);
                            }
                            adjustQualityLoop();
                        } else {
                            // Finish and reveal the download step
                            downloadBtn.style.display = 'block';
                        }
                    }, originalFile.type, quality);
                }

                adjustQualityLoop();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(originalFile);
    });

    // Trigger File Download Action and Clean State Layout
    downloadBtn.addEventListener('click', function() {
        if (!resizedBlob || !originalFile) return;

        const lastDotIndex = originalFile.name.lastIndexOf('.');
        let nameWithoutExt = originalFile.name;
        let ext = '';
        
        if (lastDotIndex !== -1) {
            nameWithoutExt = originalFile.name.substring(0, lastDotIndex);
            ext = originalFile.name.substring(lastDotIndex);
        }
        
        const outputFilename = `${nameWithoutExt}_resized_img${ext}`;

        // Create download link element anchor
        const link = document.createElement('a');
        link.href = URL.createObjectURL(resizedBlob);
        link.download = outputFilename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Auto clean-up UI states following successful export activity
        clearAndDisableAll();
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
        }
        /* Flexible Card Container with Light Sky Blue Background */
        .card-container {
            flex: 1;
            min-width: 340px;
            max-width: 500px;
            width: auto;
            height: auto;
            background-color: #87CEFA; /* Light Sky Blue */
	    border: 1px solid #ffb6c1;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);

            box-sizing: border-box;
        }
        .card-title {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .control-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #222;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="number"]:disabled {
            background-color: rgba(233, 233, 233, 0.6);
            cursor: not-allowed;
        }
        .checkbox-group {
            background: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 6px;
        }
        .checkbox-group label {
            display: inline-block;
            margin-right: 12px;
            font-weight: normal;
            cursor: pointer;
        }
        .action-btn {
            width: 100%;
            padding: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        /* Green Download Button */
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        #downloadBtn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h2 class="card-title">Image Resizer By Percentage </h2>

        <!-- Input accepts only image file format -->
        <div class="control-group">
            <label for="imageInput">Select Image:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <!-- Textbox enabled after input -->
        <div class="control-group">
            <label for="resizePercentage">Resize Percentage (10 - 100):</label>
            <input type="number" id="resizePercentage" disabled placeholder="Enter whole number">
        </div>

        <!-- Format selection with checkboxes -->
        <div class="control-group">
            <label>Output Format (Optional):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" class="format-checkbox" value="image/jpeg"> JPEG</label>
                <label><input type="checkbox" class="format-checkbox" value="image/png"> PNG</label>
                <label><input type="checkbox" class="format-checkbox" value="image/webp"> WEBP</label>
            </div>
        </div>

        <div class="control-group">
            <button id="convertBtn" class="action-btn" disabled>Convert</button>
        </div>

        <!-- Green download button hidden by default -->
        <button id="downloadBtn">Download Resized Image</button>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const resizePercentage = document.getElementById('resizePercentage');
        const checkboxes = document.querySelectorAll('.format-checkbox');
        const convertBtn = document.getElementById('convertBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalFile = null;
        let selectedFormat = null;
        let downloadUrl = null;
        let outputFileName = "";

        // Triggered whenever the choose image button is clicked
        imageInput.addEventListener('click', () => {
            resetFormState();
        });

        // Triggered when a new file selection completes
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                originalFile = e.target.files[0];
                resizePercentage.disabled = false;
                convertBtn.disabled = false;
                selectedFormat = originalFile.type; 
            } else {
                resetFormState();
            }
        });

        // Exclusive checkbox selectors logic
        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    checkboxes.forEach(cb => { if (cb !== this) cb.checked = false; });
                    selectedFormat = this.value;
                } else {
                    selectedFormat = originalFile ? originalFile.type : null;
                }
            });
        });

        // Sequence validation logic
        function runValidationSequence(value) {
            let num = parseFloat(value);
            
            if (isNaN(num)) num = 100; // Fallback safely if input empty

            // 1. Initial boundary checks
            if (num < 10) num = 10;
            if (num > 100) num = 100;

            // 2. Fractional logic: Round up to nearest whole number
            if (num % 1 !== 0) {
                num = Math.ceil(num);
            }

            // 3. Final validation against condition bounds
            if (num < 10) num = 10;
            if (num > 100) num = 100;

            return num;
        }

        convertBtn.addEventListener('click', () => {
            if (!originalFile) return;

            // Step 1: Immediately disable the textbox
            resizePercentage.disabled = true;

            // Step 2: Run mathematical parsing boundaries and update text display
            const finalPercentage = runValidationSequence(resizePercentage.value);
            resizePercentage.value = finalPercentage;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const scaleFactor = finalPercentage / 100;
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width * scaleFactor;
                    canvas.height = img.height * scaleFactor;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // Filename building pattern: input file name + resize
                    const lastDotIndex = originalFile.name.lastIndexOf('.');
                    const nameWithoutExtension = lastDotIndex !== -1 ? originalFile.name.substring(0, lastDotIndex) : originalFile.name;
                    
                    let extension = originalFile.name.substring(lastDotIndex);
                    if (selectedFormat === 'image/jpeg') extension = '.jpg';
                    if (selectedFormat === 'image/png') extension = '.png';
                    if (selectedFormat === 'image/webp') extension = '.webp';

                    outputFileName = `${nameWithoutExtension}resize${extension}`;
                    downloadUrl = canvas.toDataURL(selectedFormat);

                    // Reveal green download element
                    downloadBtn.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(originalFile);
        });

        // Download event and full reset route
        downloadBtn.addEventListener('click', () => {
            if (!downloadUrl) return;
            
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = outputFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Clear input, clear & disable textbox, disappear download button
            resetFormState();
            imageInput.value = ""; // Also wipe the file path selector completely
        });

        // Master UI field state reset function
        function resetFormState() {
	    imageInput.value = "";
            resizePercentage.value = "";
            resizePercentage.disabled = true;
            convertBtn.disabled = true;
            downloadBtn.style.display = 'none';
            checkboxes.forEach(cb => cb.checked = false);
            originalFile = null;
            selectedFormat = null;
            downloadUrl = null;
            outputFileName = "";
        }
    </script>
</body>
</html>

        }

        .row-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .row-inputs input[type="text"], 
        .row-inputs input[type="number"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #eaeaea;
            color: #666;
            cursor: not-allowed;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-change {
            background-color: #4a90e2;
            color: white;
        }

        .btn-change:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-download {
            background-color: #2ecc71; /* Green color */
            color: white;
            display: none; /* Hidden by default */
        }

        .btn-download:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>


    <!-- Card Container 3: Light Pink Resizer Panel -->
    <div class="card-container-3">
        <h3 class="card-title">Image Resizer by Pixels or by DPI</h3>
        
        <!-- Image Upload Input -->
        <div class="form-group">
            <label for="imageLoader">Choose Image File</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>

        <!-- Original Dimensions (Read Only) -->
        <div class="form-group">
            <label>Original Image Resolution</label>
            <div class="row-inputs">
                <input type="text" id="textbox1" placeholder="Horizontal Pixels" readonly>
                <input type="text" id="textbox2" placeholder="Vertical Pixels" readonly>
            </div>
        </div>

        <!-- Mode Selection 1: Custom Pixels -->
        <div class="form-group">
            <div class="checkbox-container">
                <input type="checkbox" id="checkbox1" disabled>
                <label for="checkbox1">Resize by Pixels (16 - 90,001)</label>
            </div>
            <div class="row-inputs" style="margin-top: 5px;">
                <input type="number" id="textbox3" placeholder="Target Width" disabled>
                <input type="number" id="textbox4" placeholder="Target Height" disabled>
            </div>
        </div>

        <!-- Mode Selection 2: Custom DPI -->
        <div class="form-group">
            <div class="checkbox-container">
                <input type="checkbox" id="checkbox2" disabled>
                <label for="checkbox2">Resize by DPI (30 - 550)</label>
            </div>
            <div class="row-inputs" style="margin-top: 5px;">
                <input type="number" id="textbox5" placeholder="Target DPI" disabled>
            </div>
        </div>

        <!-- Execution Buttons -->
        <button id="btnChange" class="btn btn-change" disabled>Change Image</button>
        <button id="btnDownload" class="btn btn-download">Download Resized Image</button>
    </div>

    <script>
        // DOM Elements
        const imageLoader = document.getElementById('imageLoader');
        const textbox1 = document.getElementById('textbox1');
        const textbox2 = document.getElementById('textbox2');
        const textbox3 = document.getElementById('textbox3');
        const textbox4 = document.getElementById('textbox4');
        const textbox5 = document.getElementById('textbox5');
        const checkbox1 = document.getElementById('checkbox1');
        const checkbox2 = document.getElementById('checkbox2');
        const btnChange = document.getElementById('btnChange');
        const btnDownload = document.getElementById('btnDownload');

        let originalImage = null;
        let originalFileName = "";
        let originalMimeType = "image/png";
        let finalResizedDataUrl = null;

        // Reset all states and UI inputs
        function resetUI() {
            imageLoader.value = "";
            textbox1.value = "";
            textbox2.value = "";
            
            checkbox1.checked = false;
            checkbox1.disabled = true;
            textbox3.value = "";
            textbox3.disabled = true;
            textbox4.value = "";
            textbox4.disabled = true;

            checkbox2.checked = false;
            checkbox2.disabled = true;
            textbox5.value = "";
            textbox5.disabled = true;

            btnChange.disabled = true;
            btnDownload.style.display = "none";
            
            originalImage = null;
            originalFileName = "";
            finalResizedDataUrl = null;
        }

        // Trigger reset when clicking the upload button
        imageLoader.addEventListener('click', () => {
            resetUI();
        });

        // Parse image details on upload
        imageLoader.addEventListener('change', function(event) {
            if (!event.target.files.length) return;
            
            const file = event.target.files[0];
            originalMimeType = file.type;
            
            // Extract the filename without extension
            const lastDotIndex = file.name.lastIndexOf('.');
            if (lastDotIndex !== -1) {
                originalFileName = file.name.substring(0, lastDotIndex);
            } else {
                originalFileName = file.name;
            }
            if (file) {
                // Read the file data
               const reader = new FileReader();
               reader.onload = function(readerEvent) { 
		// Create an off-screen image element to decode the image asset
                const originalImage = new Image();
                originalImage.onload = function() {
                    // Populate read-only textboxes with dimensions
                    textbox1.value = originalImage.width; // Horizontal Pixels
                    textbox2.value = originalImage.height; // Vertical Pixels

                    // Enable operational triggers
                    checkbox1.disabled = false;
                    checkbox2.disabled = false;
                    btnChange.disabled = false;
                };
                originalImage.src = readerEvent.target.result;
            };
            reader.readAsDataURL(file);
         }
        
        });

        // Mutual exclusion logic for mode selection
        checkbox1.addEventListener('change', function() {
            if (this.checked) {
                checkbox2.checked = false;
                textbox5.disabled = true;
                textbox5.value = "";
                
                textbox3.disabled = false;
                textbox4.disabled = false;
            } else {
                textbox3.disabled = true;
                textbox4.disabled = true;
            }
        });

        checkbox2.addEventListener('change', function() {
            if (this.checked) {
                checkbox1.checked = false;
                textbox3.disabled = true;
                textbox4.disabled = true;
                textbox3.value = "";
                textbox4.value = "";

                textbox5.disabled = false;
            } else {
                textbox5.disabled = true;
            }
        });

        // Execute value checks and run transformations
        btnChange.addEventListener('click', function() {
            if (!checkbox1.checked && !checkbox2.checked) {
                alert("Please select either Pixel or DPI transformation mode first.");
                return;
            }

            // Lock input parameters
            checkbox1.disabled = true;
            textbox3.disabled = true;
            textbox4.disabled = true;
            checkbox2.disabled = true;
	    textbox5.disabled = true;
            btnChange.disabled = true;
	    let targetWidth = originalImage.width;
	    let targetHeight = originalImage.height;
     if (checkbox1.checked) 
	{// Read and bounding box validation for Pixels (16 to 90001)
	let w = parseInt(textbox3.value) || 16;
	let h = parseInt(textbox4.value) || 16;
          if (w < 16) w = 16;
          if (w > 90001) w = 90001;
          if (h < 16) h = 16;
  	  if (h > 90001) h = 90001;
           textbox3.value = w;
           textbox4.value = h;
           targetWidth = w;
           targetHeight = h;
	} else if (checkbox2.checked) {
	   // Read and bounding box validation for DPI (30 to 550)
	   let dpi = parseInt(textbox5.value) || 30;
           if (dpi < 30) dpi = 30;
           if (dpi > 550) dpi = 550;
           textbox5.value = dpi;
         // Assume standard screen baseline is 72 DPI to perform dimensional calculation
          const scaleFactor = dpi / 72;
   	  targetWidth = Math.round(originalImage.width * scaleFactor);
 	  targetHeight = Math.round(originalImage.height * scaleFactor);}
         // Draw to a canvas to resizeconst 
         canvas = document.createElement('canvas');
         canvas.width = targetWidth;
         canvas.height = targetHeight;
	 const ctx = canvas.getContext('2d');
	 ctx.drawImage(originalImage, 0, 0, targetWidth, targetHeight);
        // Export to native format strings
	 finalResizedDataUrl = canvas.toDataURL(originalMimeType);
	// Display Green Download target
	  btnDownload.style.display = "block";});
        // Trigger dynamic download action and auto-cleanup
         btnDownload.addEventListener('click', function() {
	 if (!finalResizedDataUrl) return;
	// Figure out file extension
         let extension = "png";
         if (originalMimeType.includes("jpeg") || originalMimeType.includes("jpg")) extension = "jpg";
	 else if (originalMimeType.includes("gif")) extension = "gif";
	 else if (originalMimeType.includes("webp")) extension = "webp";
	 const downloadLink = document.createElement('a');
	 downloadLink.href = finalResizedDataUrl;
          downloadLink.download = ${originalFileName}_img_resized.${extension};
	 document.body.appendChild(downloadLink);
	 downloadLink.click();
	 document.body.removeChild(downloadLink);
          // Post-download hard wipe
	  resetUI();
         });
</script>

</body>
</html>
